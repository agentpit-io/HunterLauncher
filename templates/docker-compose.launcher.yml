# ~/.hunter/app/docker-compose.launcher.yml
# 由 Hunter 启动器生成 · 请勿手改（改了下次启动会被覆盖）
# 作用：1) 把除 web 之外的端口全部收回 127.0.0.1（总控规则红线 4）
#       2) 落实端口冲突改写后的值
#
# `!override` 标签是必须的：compose 默认对 ports 做**追加**合并，不加这个标签会变成
# 「既监听 0.0.0.0 又监听 127.0.0.1」，红线 4 就白写了（M0 §3.4 已实测验证）。
services:
  web:
    ports: !override ["${WEB_HOST_PORT:-3100}:3000"]
  api:
    ports: !override ["127.0.0.1:${API_HOST_PORT:-8100}:8000"]
  opencode:
    ports: !override ["127.0.0.1:${OPENCODE_HOST_PORT:-3921}:3901"]
  postgres:
    ports: !override ["127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"]
  redis:
    ports: !override ["127.0.0.1:${REDIS_HOST_PORT:-6479}:6379"]
