[package]
name = "hunter-launcher"
version = "0.1.0"
description = "Hunter 启动器 · 把 hunter-community 的部署变成「下载 → 填一把 key → 等几分钟」"
authors = ["agentpit.io"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/agentpit-io/HunterLauncher"

# Rust 侧的库名，Tauri 的移动端入口要求它以 _lib 结尾
[lib]
name = "hunter_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
# 默认的 custom-protocol 特性。`tauri build` 会自动带上它；
# 直接 `cargo build --release` 时如果不带，产物会去连 devUrl（http://localhost:1420）而不是用内嵌的前端，
# 结果就是一个白屏窗口 —— M1 在这上面花了一轮排查，记在成果文档第九节。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
