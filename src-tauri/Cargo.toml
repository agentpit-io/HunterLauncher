[package]
name = "hunter-launcher"
version = "0.1.13"
description = "Hunter 启动器 · 把 hunter-community 的部署变成「下载 → 填一把 key → 等几分钟」"
authors = ["agentpit.io"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
repository = "https://github.com/agentpit-io/HunterLauncher"

# Rust 侧的库名，Tauri 的移动端入口要求它以 _lib 结尾
[lib]
name = "hunter_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘（方案 §5.8）。image-png：托盘图标要从 PNG 解出来
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 配置文件（~/.hunter/launcher.toml）
toml = "1"
# HTTP：阻塞式、纯 Rust TLS。启动器绝大部分工作本来就是阻塞的（等 docker 子进程），
# 为几个请求把整套代码染成 async 不划算；Tauri 那边统一用 spawn_blocking 挪到工作线程。
ureq = { version = "3", features = ["json"] }
http = "1"
# 校验下载回来的 compose 文件
sha2 = "0.11"
# 生成 JWT_SECRET / 数据库口令，用操作系统的 CSPRNG
getrandom = "0.4"
# headless 模式下输入 key 时不回显
rpassword = "7"
# 端口探测（I5 · P0）。必须用它显式构造套接字：`std::net::TcpListener` 在 Unix 上
# 默认开 SO_REUSEADDR，macOS 的 BSD 语义下会把「已被 *:P 占死的端口」判成空闲 ——
# 0.1.4 在用户 Mac 上装不起来就是这一条。详见 src/ports.rs 的模块注释
socket2 = "0.6"
# 离线包导入要选文件（方案 §9）。系统原生的文件选择框，比让用户手抄路径靠谱
tauri-plugin-dialog = "2"
# 三平台统一的宿主机指标（I12 · R2）。CPU 占用、内存、磁盘在三个系统上是三套 API
# （macOS 的 host_statistics / Linux 的 /proc / Windows 的 GlobalMemoryStatusEx），
# 自己写等于把三套平台代码搬进来。Linux 上它只拖 libc + memchr 两个依赖。
# 关掉用不上的特性（网络、进程、组件温度、用户列表），只留 system + disk
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
# headless 下自己验 updater 清单与安装包的签名（见 selfupdate.rs 的「两条路」一节）。
# 这个 crate 本来就在依赖树里（tauri-plugin-updater 用它），直接依赖不增加体积
minisign-verify = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# 启动器自更新（方案 §10）。端点是 COS（国内）与 GitHub Release 两个 latest.json，
# 公钥写在 tauri.conf.json 里，私钥只在开发机 ~/.hunter-launcher-keys/ 与仓库 secrets 里（红线 7）
tauri-plugin-updater = "2"

[features]
# 默认的 custom-protocol 特性。`tauri build` 会自动带上它；
# 直接 `cargo build --release` 时如果不带，产物会去连 devUrl（http://localhost:1420）而不是用内嵌的前端，
# 结果就是一个白屏窗口 —— M1 在这上面花了一轮排查，记在成果文档第九节。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
