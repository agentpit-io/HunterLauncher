name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 发布通道标记。vite.config.ts 里有断言：这个值是 release 时不允许同时带 VITE_DEMO=1
  HUNTER_CHANNEL: release

jobs:
  frontend:
    name: 前端 · lint / typecheck / vitest / build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 已停用的国内源地址不许再出现在仓库里
        # 国内源 2026-09-19 从腾讯云广州区改到香港区，广州区的仓库与桶都已删除。
        # 名单与豁免规则都在脚本里（写在这里的话，这份 yml 自己就会被判违规）。
        run: ./scripts/check-retired-mirrors.sh
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: 类型检查
        run: pnpm typecheck
      - name: 字体子集覆盖了所有会上屏的中文（忘了重新生成 = 界面上多一个豆腐块）
        # 只盯「能显示出来的字」：前端全文 + Rust 的字符串字面量。改注释不会触发。
        run: python3 scripts/check-fonts.py
      - name: COS 清理规则的自测（这个脚本会真删桶里的东西，逻辑不能只靠眼看）
        run: python3 scripts/cos-prune.py --self-test
      - name: 单元测试
        run: pnpm test
      - name: 构建前端
        run: pnpm exec vite build
      - name: 红线 1 · 发布产物里不许有演示数据
        run: |
          set -e
          if grep -rl "HUNTER_DEMO_DATA_MARKER" dist/ ; then
            echo "::error::发布构建里出现了演示数据标记（总控规则红线 1）"
            exit 1
          fi
          echo "OK：dist/ 里没有演示数据"
      - name: 红线 1 · 演示构建必须带标记（确保检查本身是有效的）
        run: |
          set -e
          HUNTER_CHANNEL=dev VITE_DEMO=1 pnpm exec vite build --outDir dist-demo
          grep -rl "HUNTER_DEMO_DATA_MARKER" dist-demo/ >/dev/null
          echo "OK：演示构建里有标记，说明上一步的检查不是空跑"
          rm -rf dist-demo
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  rust:
    name: Rust · fmt / test / clippy / tauri build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            build-essential curl wget file pkg-config \
            xdg-utils
      # xdg-utils 不在 Tauri 官方依赖清单里，但 AppImage 打包要把 xdg-open 塞进 AppDir，
      # 缺了会在打包最后一步才失败（M0 §6.3 踩过）
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建前端（tauri build 需要 dist/）
        run: pnpm exec vite build
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo test（单元测试，含红线 2 的「日志里不许有 key」看门测试）
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: tauri build（打 .deb 与 .AppImage）
        # M3 起 CI 真打 Linux 安装包：本地能装不等于干净机器能装，
        # 让 CI 每次都把这两个包产出来，出问题当天就知道。
        #
        # `createUpdaterArtifacts` 在这里关掉：配置里它是开的（发布时要出 .sig），
        # 而签名要 TAURI_SIGNING_PRIVATE_KEY —— CI 不该、fork 的 PR 也拿不到那个 secret。
        # CI 这一步要验的是「能不能打出装得上的包」，签名留给 release.yml。
        run: >
          pnpm exec tauri build --bundles deb,appimage
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: 产物改成不带空格的文件名
        # Tauri 用 productName（"Hunter Launcher"）当文件名，带一个空格。
        # 装包能装，但下载地址里会变成 %20，命令行里每次都要加引号 —— 统一改掉。
        # 发布流水线要用同一套命名往 COS / Release 上传。
        #
        # 待办池 P2-17：原来这里把版本号拼进源文件名（`Hunter Launcher_${V}_amd64.deb`），
        # 一旦版本号带后缀（`0.1.3-rc.1`）或者哪天 Tauri 改了命名规则，这一步就 `mv` 不到东西。
        # 改成和 release.yml 完全一样的做法：**按前缀替换，不猜版本号**。
        run: |
          set -e
          for f in src-tauri/target/release/bundle/deb/*.deb \
                   src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$f" ] || continue
            d=$(dirname "$f"); b=$(basename "$f")
            n=${b//Hunter Launcher/hunter-launcher}
            n=${n//hunter Launcher/hunter-launcher}
            [ "$n" = "$b" ] || mv "$f" "$d/$n"
            echo "→ $d/$n"
          done
          # 改完必须真的存在，否则后面几步会静默地跳过（glob 没匹配到就是空）
          ls src-tauri/target/release/bundle/deb/hunter-launcher_*_amd64.deb
          ls src-tauri/target/release/bundle/appimage/hunter-launcher_*_amd64.AppImage
      - name: 产物体积
        run: |
          ls -la src-tauri/target/release/hunter-launcher
          ls -la src-tauri/target/release/bundle/deb/*.deb
          ls -la src-tauri/target/release/bundle/appimage/*.AppImage
      - name: deb 的元信息与依赖（装不上多半是这里出问题）
        run: |
          dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb
          # 托盘要 libayatana-appindicator3-1；漏了它在很多桌面上托盘直接不出现
          dpkg-deb --field src-tauri/target/release/bundle/deb/*.deb Depends \
            | grep -q libayatana-appindicator3-1
          echo "OK：deb 依赖里有 libayatana-appindicator3-1"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

  cross:
    name: 跨平台编译 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_targets: ''
          - os: macos-latest
            # universal 要两个 target 都在，release.yml 打包时用的就是它们 ——
            # 在 CI 里就把 target 装齐，别等到发版那天才发现少一个
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      # Windows / macOS 没有真机测试环境，CI 能编过 + 单测通过 + 代码审阅是这两个平台唯一的验收手段
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo test（三平台共用的纯逻辑部分在这里也要过）
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # I5 · 这一条是为「只有 macOS 才炸」的缺陷准备的。
      #
      # 0.1.4 在用户的 Mac 上把四个被占死的端口判成了空闲，而测试机（Linux）四个场景全过 ——
      # 根因是 `std::net::TcpListener` 在 Unix 上默认开 SO_REUSEADDR，BSD 语义下它允许
      # 「绑 127.0.0.1:P」在「*:P 已被占」时照样成功，Linux 内核则不允许。
      # 这一步在真的 macOS runner 上起一个带 SO_REUSEADDR 的 *:port 监听（模拟 OrbStack 的端口转发），
      # 断言 crate::ports 判它为「占用」。上面那条 `cargo test` 已经包含它了，
      # 这里单独再跑一次并 `--nocapture`，是为了让它红的时候一眼能看出是**这一条**红了。
      - name: 端口探测在 macOS 上的回归（I5 · P0）
        if: runner.os == 'macOS'
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
          ports::tests -- --nocapture --test-threads=1
      # I6 · 同样是「只有 macOS 才炸」的那一类，只是深了一层：
      #
      # I4 修好了「启动器找得到 docker」，0.1.5 真机上卡在「**docker 自己**找不到
      # docker-credential-osxkeychain」—— 子进程继承的还是 GUI 那份受限 PATH。
      # 这一步在真的 macOS runner 上测 PATH 构造函数：受限 PATH + 助手在已知位置 → 必须找得到，
      # 而受限 PATH 本身必须找不到（两边都断言，否则这条测试可能什么都没测）。
      #
      # **runner 上有没有装 docker 都能跑**：测的是 runtime::env 的纯函数，造的是临时目录。
      - name: 子进程 PATH 补全在 macOS 上的回归（I6 · P0）
        if: runner.os == 'macOS'
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
          runtime::env::tests -- --nocapture --test-threads=1
      # I7 · 内置运行时那条路上，**能在 CI 上验的那一半**：
      #
      # 清单的形状（sha256 是 64 位小写、地址里不许出现 latest、两个架构四件套齐全、
      # 同组件两架构同版本、没有复制粘贴出来的重复 sha256）、vm_params 的区间、
      # supported() 在非 macOS 上说得出原因、三个隔离环境变量齐全。
      #
      # **真正起虚拟机那一段验不了**：GitHub 的 macOS runner 不支持嵌套虚拟化。
      # 需要联网的那两条（真下文件核对 sha256、八个文件的 HEAD）是 #[ignore] 的，
      # 这里不跑 —— CI 不该依赖上游的可用性。
      - name: 内置运行时的清单与纯逻辑（I7）
        # `cargo test A B C` 是**过不了的**：cargo 只收一个位置参数当过滤串，
        # 第二个就报 `unexpected argument`（I7 第一次推上 CI 当场红的两条之一）。
        # 多个过滤串要整体放到 `--` 后面交给 libtest —— 它是支持多个的（取并集）。
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
          -- --nocapture --test-threads=1
          runtime::manifest::tests runtime::builtin::tests runtime::orbstack::tests
      # M4 起 PR 上也真编一次 release 二进制。
      # `cargo check` 编不出 `custom-protocol` 那条路径，而正是那条路径出过问题
      # （M1 §9：不带这个特性的产物会去连 devUrl，表现为白屏）。
      # 这里只编不打包（--no-bundle）：真打包在 release.yml 里，PR 上没必要等那十几分钟。
      - name: tauri build --no-bundle（真编一次发布二进制）
        run: pnpm exec tauri build --no-bundle
