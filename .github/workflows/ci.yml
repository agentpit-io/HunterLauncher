name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 发布通道标记。vite.config.ts 里有断言：这个值是 release 时不允许同时带 VITE_DEMO=1
  HUNTER_CHANNEL: release

jobs:
  frontend:
    name: 前端 · lint / typecheck / vitest / build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 已停用的国内源地址不许再出现在仓库里
        # 国内源 2026-09-19 从腾讯云广州区改到香港区，广州区的仓库与桶都已删除。
        # 名单与豁免规则都在脚本里（写在这里的话，这份 yml 自己就会被判违规）。
        run: ./scripts/check-retired-mirrors.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: 类型检查
        run: pnpm typecheck
      - name: 字体子集覆盖了所有中文（加了新文案却忘了重新生成子集 = 界面上多一个豆腐块）
        run: python3 scripts/check-fonts.py
      - name: 单元测试
        run: pnpm test
      - name: 构建前端
        run: pnpm exec vite build
      - name: 红线 1 · 发布产物里不许有演示数据
        run: |
          set -e
          if grep -rl "HUNTER_DEMO_DATA_MARKER" dist/ ; then
            echo "::error::发布构建里出现了演示数据标记（总控规则红线 1）"
            exit 1
          fi
          echo "OK：dist/ 里没有演示数据"
      - name: 红线 1 · 演示构建必须带标记（确保检查本身是有效的）
        run: |
          set -e
          HUNTER_CHANNEL=dev VITE_DEMO=1 pnpm exec vite build --outDir dist-demo
          grep -rl "HUNTER_DEMO_DATA_MARKER" dist-demo/ >/dev/null
          echo "OK：演示构建里有标记，说明上一步的检查不是空跑"
          rm -rf dist-demo
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  rust:
    name: Rust · fmt / test / clippy / tauri build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            build-essential curl wget file pkg-config \
            xdg-utils
      # xdg-utils 不在 Tauri 官方依赖清单里，但 AppImage 打包要把 xdg-open 塞进 AppDir，
      # 缺了会在打包最后一步才失败（M0 §6.3 踩过）
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建前端（tauri build 需要 dist/）
        run: pnpm exec vite build
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo test（单元测试，含红线 2 的「日志里不许有 key」看门测试）
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: tauri build（打 .deb 与 .AppImage）
        # M3 起 CI 真打 Linux 安装包：本地能装不等于干净机器能装，
        # 让 CI 每次都把这两个包产出来，出问题当天就知道。
        run: pnpm exec tauri build --bundles deb,appimage
      - name: 产物改成不带空格的文件名
        # Tauri 用 productName（"Hunter Launcher"）当文件名，带一个空格。
        # 装包能装，但下载地址里会变成 %20，命令行里每次都要加引号 —— 统一改掉。
        # M4 的发布流水线要用同一套命名往 COS / Release 上传。
        run: |
          set -e
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mv "src-tauri/target/release/bundle/deb/Hunter Launcher_${V}_amd64.deb" \
             "src-tauri/target/release/bundle/deb/hunter-launcher_${V}_amd64.deb"
          mv "src-tauri/target/release/bundle/appimage/Hunter Launcher_${V}_amd64.AppImage" \
             "src-tauri/target/release/bundle/appimage/hunter-launcher_${V}_amd64.AppImage"
      - name: 产物体积
        run: |
          ls -la src-tauri/target/release/hunter-launcher
          ls -la src-tauri/target/release/bundle/deb/*.deb
          ls -la src-tauri/target/release/bundle/appimage/*.AppImage
      - name: deb 的元信息与依赖（装不上多半是这里出问题）
        run: |
          dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb
          # 托盘要 libayatana-appindicator3-1；漏了它在很多桌面上托盘直接不出现
          dpkg-deb --field src-tauri/target/release/bundle/deb/*.deb Depends \
            | grep -q libayatana-appindicator3-1
          echo "OK：deb 依赖里有 libayatana-appindicator3-1"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

  cross:
    name: 跨平台编译 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      # Windows / macOS 没有真机测试环境，CI 能编过 + 单测通过 + 代码审阅是这两个平台唯一的验收手段
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo test（三平台共用的纯逻辑部分在这里也要过）
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
