# 内置运行时的国内镜像（I7）。
#
# 启动器在「这台电脑上没有 Docker」时会去下 Colima + Lima + docker CLI + compose。
# 版本与 sha256 **写死在 src-tauri/src/runtime/manifest.rs 里**，两个源并列测速：
# 官方地址（GitHub / download.docker.com）与腾讯云香港桶。
#
# 这条流水线做两件事：
#   · check —— 每天核对一遍「桶里的副本是不是还和清单逐字节相同」。
#     对不上就红：那说明要么有人手动改过桶，要么上游把同名文件重打了包。
#   · sync  —— 手动触发时，把桶里缺的补上（补之前先按清单校验官方地址下回来的内容）。
#
# **不自动跟着 latest 走。** 升级运行时是「改 manifest.rs + 重新发一版启动器」，
# 是一次有记录的改动，不是一次漂移。
name: 内置运行时国内镜像

on:
  schedule:
    # 每天 04:20 UTC（上海 12:20）
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      sync:
        description: '把桶里缺的补上（不勾选就只检查）'
        type: boolean
        default: false
  push:
    paths:
      - 'src-tauri/src/runtime/manifest.rs'
      - 'scripts/runtime-mirror.py'
      - '.github/workflows/runtime-mirror.yml'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install boto3
      - name: 核对桶里的副本与清单是否一致
        env:
          CN_DOWNLOAD_BASE: ${{ vars.CN_DOWNLOAD_BASE }}
        run: python3 scripts/runtime-mirror.py --check
      - name: 把缺的补上
        if: github.event_name == 'workflow_dispatch' && inputs.sync
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          CN_DOWNLOAD_BASE: ${{ vars.CN_DOWNLOAD_BASE }}
        run: python3 scripts/runtime-mirror.py --sync
